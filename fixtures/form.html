<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Student Form</title></head>
<body>
  <main><h1>Student Form</h1><form id="student-form">
    <label for="firstName">First name</label><input id="firstName" name="firstName" required>
    <label for="email">Email</label><input id="email" name="email" type="email" required>
    <label for="mobile">Mobile</label><input id="mobile" name="mobile" type="tel" maxlength="10" required>
    <label for="birthDate">Date of birth</label><input id="birthDate" name="birthDate" type="date" required>
    <fieldset><legend>Gender</legend><label><input type="radio" name="gender" value="Male" required> Male</label><label><input type="radio" name="gender" value="Female"> Female</label></fieldset>
    <fieldset><legend>Hobbies</legend><label><input type="checkbox" name="hobbies" value="Sports"> Sports</label><label><input type="checkbox" name="hobbies" value="Music"> Music</label></fieldset>
    <label for="subject">Subject</label><select id="subject" name="subject" required><option value="">Choose</option><option>Maths</option><option>Physics</option></select>
    <label for="address">Address</label><textarea id="address" name="address"></textarea>
    <button id="submit">Submit</button>
  </form><div data-testid="submit-success" hidden>Submitted successfully</div></main>
  <script>document.querySelector('form').addEventListener('submit', event => { event.preventDefault(); document.querySelector('[data-testid="submit-success"]').hidden = false; });</script>
</body></html>
