<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="popup.css"><title>BrowserForge</title></head>
  <body>
    <main>
      <h1>BrowserForge</h1>
      <p id="page-url">Reading current page…</p>
      <label for="mode">Generation mode</label>
      <select id="mode">
        <option value="single">Current page</option>
        <option value="write">Current page — write demo</option>
        <option value="flow">Standard site flow (unlimited pages / depth / time)</option>
      </select>
      <button id="create" type="button">Generate Skill</button>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
